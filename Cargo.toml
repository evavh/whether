[package]
name = "whether"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
hdf5-metno = { version = "0.10.1", features = ["static", "zlib"] }
log = "0.4.27"
reqwest = { version = "0.12.22", features = ["blocking", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.47.1", features = ["fs", "macros", "rt", "rt-multi-thread"] }
toml = "0.9.4"
